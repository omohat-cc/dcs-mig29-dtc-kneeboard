document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d1c00561-df44-4af3-8ad0-e62df17a65a6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8fd27759-35ba-45da-ad61-4fea921553b3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a2078cc5-9c79-437c-a557-3b7571c66605\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ────────────────────────────────────────────────────────────────────────────\n   *  COLOR — base palette\n   * ──────────────────────────────────────────────────────────────────────────── */\n\n  /* Surfaces: warm off-white \"kneeboard paper\" */\n  --paper:        #f3f1ec;   /* page background */\n  --paper-2:      #e8e4dc;   /* secondary fills, footer band, callouts */\n  --paper-3:      #dcd6c8;   /* card lift, gentle highlight */\n  --rule:         #c8c2b6;   /* dotted dividers, hairlines */\n  --rule-dim:     #d8d3c7;   /* very faint rule */\n\n  /* Ink: dark UI / typography */\n  --ink:          #15171a;   /* body text, dark headers (\"filing-tab\") */\n  --ink-2:        #2c2f35;   /* secondary dark */\n  --ink-muted:    #6b6f78;   /* muted dark — used for secondary tabs (\"Legends\") */\n  --ink-3:        #8a8e95;   /* tertiary text (closed/inoperative) */\n\n  /* Brand */\n  --brand-yellow:    #f7d046;  /* the DimOn pennant */\n  --brand-yellow-2:  #ffe06b;  /* highlight */\n  --brand-amber:     #d9a722;  /* magvar isolines on maps, warm accent */\n\n  /* Data colors — each carries domain meaning */\n  --data-navy:    #1f3a8a;   /* coordinates (primary blue) */\n  --data-blue:    #1f5fa0;   /* PRMG channel, secondary blue, country=GE */\n  --data-sky:     #62a3d6;   /* RSBN (italic blue) */\n  --data-magenta: #b51c7a;   /* VOR/DME frequency */\n  --data-brown:   #8a5a1f;   /* NDB frequency, dirt-runway color */\n  --data-ochre:   #c89244;   /* hill iconography */\n  --data-teal:    #1c7a78;   /* grass-runway color, water on maps */\n  --data-green:   #1f8a3f;   /* ILS frequency */\n  --data-red:     #c1273b;   /* warnings, short-runway flags, errors */\n  --data-orange:  #e26a1a;   /* country=RU dot */\n  --data-green-2: #2e9b3e;   /* country=AB dot */\n\n  /* ────────────────────────────────────────────────────────────────────────────\n   *  COLOR — semantic aliases\n   * ──────────────────────────────────────────────────────────────────────────── */\n  --bg:           var(--paper);\n  --bg-elev:      #ffffff;            /* the floating label cards on maps */\n  --fg:           var(--ink);\n  --fg-2:         var(--ink-2);\n  --fg-muted:     var(--ink-muted);\n  --fg-dim:       var(--ink-3);\n\n  --tab-bg:       var(--ink);          /* primary filing-tab fill */\n  --tab-bg-muted: var(--ink-muted);    /* \"Legends\" / \"Extras\" tabs */\n  --tab-fg:       #ffffff;\n  --pennant-bg:   var(--brand-yellow);\n  --pennant-fg:   var(--ink);\n\n  --warn:         var(--data-red);\n  --ok:           var(--data-green);\n\n  /* ────────────────────────────────────────────────────────────────────────────\n   *  TYPE — families\n   * ──────────────────────────────────────────────────────────────────────────── */\n\n  /* Display / titles — heavy condensed sans (PDF uses something Barlow-Condensed-ish) */\n  --font-display: \"Barlow Condensed\", \"Oswald\", \"Arial Narrow\", system-ui, sans-serif;\n  /* Body — humanist sans for explanatory copy */\n  --font-body:    \"Barlow\", \"Inter\", system-ui, -apple-system, sans-serif;\n  /* Mono — ALL data, coordinates, frequencies, ICAO codes */\n  --font-mono:    \"JetBrains Mono\", \"Roboto Mono\", \"IBM Plex Mono\", ui-monospace, \"Consolas\", monospace;\n\n  /* ────────────────────────────────────────────────────────────────────────────\n   *  TYPE — scale (kneeboard pages target ~150 DPI portrait at 1536×2048)\n   * ──────────────────────────────────────────────────────────────────────────── */\n  --fs-xxs:   10px;\n  --fs-xs:    11px;\n  --fs-sm:    12px;\n  --fs-md:    14px;\n  --fs-lg:    16px;\n  --fs-xl:    18px;\n  --fs-2xl:   22px;\n  --fs-3xl:   28px;\n  --fs-4xl:   36px;\n  --fs-5xl:   48px;\n  --fs-6xl:   64px;\n\n  --lh-tight:  1.05;\n  --lh-snug:   1.20;\n  --lh-normal: 1.45;\n  --lh-loose:  1.6;\n\n  --tracking-tight:  -0.01em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.04em;\n  --tracking-x-wide:  0.12em;  /* tracked uppercase eyebrows */\n\n  /* ────────────────────────────────────────────────────────────────────────────\n   *  SPACING & RADII (intentionally small/sharp — this is a technical document)\n   * ──────────────────────────────────────────────────────────────────────────── */\n  --sp-0:  2px;\n  --sp-1:  4px;\n  --sp-2:  6px;\n  --sp-3:  8px;\n  --sp-4:  12px;\n  --sp-5:  16px;\n  --sp-6:  20px;\n  --sp-7:  24px;\n  --sp-8:  32px;\n  --sp-9:  48px;\n  --sp-10: 64px;\n\n  --r-0:  0px;\n  --r-1:  2px;\n  --r-2:  4px;\n  --r-3:  8px;\n  --r-4:  12px;\n  --r-pill: 999px;\n\n  /* The signature 45° notch — used on filing tabs / pennants */\n  --notch:        12px;\n  --notch-sm:     8px;\n  --notch-lg:     16px;\n\n  /* Shadows — minimal. Real kneeboards are matte. */\n  --shadow-card:  0 1px 0 rgba(0,0,0,0.04), 0 4px 12px rgba(20,20,20,0.06);\n  --shadow-tab:   0 1px 0 rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.10);\n  --shadow-pop:   0 6px 20px rgba(0,0,0,0.12);\n\n  --border-strong: 1px solid var(--ink);\n  --border-med:    1px solid var(--rule);\n  --border-soft:   1px solid var(--rule-dim);\n}\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  SEMANTIC ELEMENT STYLES\n *  Use these by adding the class OR by relying on the bare element selectors\n *  inside `.kb` (kneeboard) scopes.\n * ────────────────────────────────────────────────────────────────────────────── */\n\n.kb, .kb-page {\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--font-body);\n  font-size: var(--fs-md);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.kb h1, .kb-h1 {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: var(--fs-5xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  text-transform: uppercase;\n  margin: 0;\n}\n.kb h2, .kb-h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n  margin: 0;\n}\n.kb h3, .kb-h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-2xl);\n  line-height: var(--lh-snug);\n  margin: 0;\n}\n.kb h4, .kb-h4 {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-lg);\n  line-height: var(--lh-snug);\n  margin: 0;\n}\n.kb p, .kb-p {\n  font-family: var(--font-body);\n  font-size: var(--fs-md);\n  line-height: var(--lh-normal);\n  margin: 0 0 var(--sp-4) 0;\n}\n.kb code, .kb-code, .kb-data {\n  font-family: var(--font-mono);\n  font-size: 0.95em;\n  font-variant-ligatures: none;\n}\n.kb-eyebrow {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-xxs);\n  letter-spacing: var(--tracking-x-wide);\n  text-transform: uppercase;\n  color: var(--ink-2);\n}\n.kb-caps {\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  font-weight: 700;\n}\n.kb-italic-note {\n  font-style: italic;\n  color: var(--ink-2);\n}\n.kb-strike {\n  text-decoration: line-through;\n  text-decoration-thickness: 1.5px;\n  color: var(--ink-3);\n}\n\n/* Data-color utility classes — match PDF's information color scheme exactly */\n.d-coord    { color: var(--data-navy);    font-family: var(--font-mono); }\n.d-vor      { color: var(--data-magenta); font-family: var(--font-mono); }\n.d-ndb      { color: var(--data-brown);   font-family: var(--font-mono); }\n.d-tacan    { color: var(--ink);          font-family: var(--font-mono); font-style: italic; }\n.d-rsbn     { color: var(--data-sky);     font-family: var(--font-mono); font-style: italic; }\n.d-ils      { color: var(--data-green);   font-family: var(--font-mono); }\n.d-prmg     { color: var(--data-blue);    font-family: var(--font-mono); }\n.d-flag     { color: var(--data-red);     font-family: var(--font-mono); }\n.d-paved    { color: var(--ink);          font-family: var(--font-mono); }\n.d-dirt     { color: var(--data-brown);   font-family: var(--font-mono); }\n.d-grass    { color: var(--data-teal);    font-family: var(--font-mono); }\n.d-faded    { opacity: 0.45; }\n<\u002Fstyle>\n<style>/* DCS Kneeboards Design System — kneeboard.css\n * Layout primitives: filing-tab headers, pennants, page frames, data tables,\n * map labels, country chips, and the runway / terrain pictogram fonts.\n * --------------------------------------------------------------------------------\n * Depends on colors_and_type.css being loaded first.\n * -------------------------------------------------------------------------------- */\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-PAGE — the kneeboard sheet itself\n *  A4-portrait-ish proportions (3:4). Designed to be embedded in a page or\n *  a tablet frame at any size; the inside uses fixed-px scale so it stays\n *  pixel-precise for screenshots.\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-page {\n  position: relative;\n  width: 768px;\n  aspect-ratio: 3 / 4;\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--font-body);\n  overflow: hidden;\n  isolation: isolate;\n}\n\n/* Default header strip across the top of a kneeboard page */\n.kb-header {\n  display: grid;\n  grid-template-columns: auto 1fr auto auto;\n  align-items: stretch;\n  gap: 0;\n  height: 44px;\n  border-bottom: 1.5px solid var(--ink);\n  background: transparent;\n}\n\n/* The dark \"filing tab\" used for page numbers and section headers\n * Signature: a sharp 45° notch at the bottom-right corner. */\n.kb-tab {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: var(--tab-bg);\n  color: var(--tab-fg);\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-xl);\n  padding: 6px 18px 6px 14px;\n  position: relative;\n  clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);\n  letter-spacing: 0.02em;\n}\n.kb-tab--muted { background: var(--tab-bg-muted); }\n.kb-tab--page-num {\n  min-width: 56px;\n  font-size: var(--fs-2xl);\n  padding-left: 16px;\n  padding-right: 22px;\n}\n.kb-tab--inline {\n  display: inline-flex;\n  height: 28px;\n  font-size: var(--fs-sm);\n  padding: 4px 16px 4px 10px;\n  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);\n}\n.kb-tab--small {\n  height: 22px;\n  font-size: var(--fs-xs);\n  padding: 2px 14px 2px 8px;\n  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);\n}\n\n/* Reverse-notched tab — used as a sub-section chip below the title\n * Notch is at top-right. */\n.kb-subtab {\n  display: inline-flex;\n  align-items: center;\n  background: var(--tab-bg);\n  color: var(--tab-fg);\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-md);\n  height: 24px;\n  padding: 0 14px 0 10px;\n  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);\n  letter-spacing: 0.04em;\n}\n\n/* Section title (sits in middle of header) */\n.kb-title {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 0 var(--sp-5);\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-3xl);\n  letter-spacing: var(--tracking-tight);\n  line-height: 1;\n  color: var(--ink);\n}\n.kb-title sup {\n  font-size: 0.45em;\n  font-weight: 600;\n  vertical-align: super;\n  margin-left: 4px;\n  color: var(--ink-2);\n}\n\n/* The yellow DimOn pennant — bottom-right notched flag */\n.kb-pennant {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: var(--pennant-bg);\n  color: var(--pennant-fg);\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-md);\n  padding: 6px 18px 14px 14px;\n  position: relative;\n  /* Trapezoid pennant with bottom-right notch */\n  clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - 14px) 100%, 0 100%);\n  letter-spacing: -0.01em;\n}\n.kb-pennant .em { color: var(--ink); font-weight: 800; }\n.kb-pennant .em + .light { font-weight: 500; }\n\n/* Simple horizontal hairline used between body sections */\n.kb-rule {\n  border: 0;\n  border-top: 1px solid var(--ink);\n  margin: 0;\n}\n.kb-rule--soft { border-top-color: var(--rule); }\n.kb-rule--dotted {\n  border-top: 0;\n  background-image: linear-gradient(to right, var(--rule) 0 50%, transparent 50% 100%);\n  background-size: 6px 1px;\n  background-repeat: repeat-x;\n  height: 1px;\n}\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-DATA-TABLE — the dense aerodrome data row layout\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-family: var(--font-mono);\n  font-size: var(--fs-sm);\n  line-height: 1.35;\n}\n.kb-table tr + tr td {\n  border-top: 1px dotted var(--rule);\n}\n.kb-table td {\n  padding: 8px 10px;\n  vertical-align: top;\n  white-space: nowrap;\n}\n.kb-table .num {\n  width: 28px;\n  color: var(--ink-2);\n  text-align: right;\n  padding-right: 6px;\n}\n.kb-table .name {\n  font-family: var(--font-body);\n  font-weight: 700;\n}\n.kb-table .icao {\n  color: var(--ink-2);\n  font-size: 0.9em;\n  margin-left: 4px;\n}\n.kb-table .ctry {\n  font-family: var(--font-mono);\n  font-size: 0.85em;\n  color: var(--ink-2);\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n}\n.kb-table .coord { color: var(--data-navy); }\n\n/* Vertical column gutters — dotted, like the PDF */\n.kb-table .col-sep {\n  border-left: 1px dotted var(--rule);\n}\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-CARD — for floating map labels and index thumbnails\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-label {\n  display: inline-flex;\n  align-items: stretch;\n  background: var(--bg-elev);\n  border-radius: 4px;\n  box-shadow: var(--shadow-card);\n  font-family: var(--font-body);\n  font-size: var(--fs-sm);\n  overflow: hidden;\n  border-top: 2px solid var(--data-blue);\n}\n.kb-label__num {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 22px;\n  padding: 0 6px;\n  font-family: var(--font-body);\n  font-weight: 700;\n  color: var(--ink);\n}\n.kb-label__body {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 4px 10px 4px 6px;\n  font-family: var(--font-mono);\n  font-size: var(--fs-sm);\n}\n.kb-label__name { font-family: var(--font-body); font-weight: 700; color: var(--ink); }\n\n.kb-label--ru { border-top-color: var(--data-orange); }\n.kb-label--ge { border-top-color: var(--data-blue); }\n.kb-label--ab { border-top-color: var(--data-green-2); }\n.kb-label--us { border-top-color: var(--ink-muted); }\n\n/* Country dot chip (legend list) */\n.kb-ctry-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-xxs);\n  letter-spacing: var(--tracking-x-wide);\n  text-transform: uppercase;\n  color: var(--ink);\n}\n.kb-ctry-chip::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  background: currentColor;\n}\n.kb-ctry-chip[data-c=\"ru\"]::before { background: var(--data-orange); }\n.kb-ctry-chip[data-c=\"ge\"]::before { background: var(--data-blue); }\n.kb-ctry-chip[data-c=\"ab\"]::before { background: var(--data-green-2); }\n.kb-ctry-chip[data-c=\"us\"]::before { background: var(--ink-muted); }\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-CALLOUT — light \"tip\" panel used at page bottoms\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-callout {\n  background: var(--paper-2);\n  padding: var(--sp-5) var(--sp-6);\n  border-radius: var(--r-3);\n  font-family: var(--font-body);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-normal);\n}\n.kb-callout strong { font-weight: 700; }\n\n/* \"Year range\" inline chips that highlight the current era */\n.kb-year-chip {\n  font-family: var(--font-mono);\n  font-size: var(--fs-xs);\n  padding: 2px 6px;\n  border-radius: 2px;\n  background: transparent;\n  color: var(--ink);\n}\n.kb-year-chip[data-active=\"true\"] {\n  background: var(--paper-3);\n  color: var(--ink);\n  font-weight: 700;\n}\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-INDEX-CARD — used on the cover for region thumbnails\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-index {\n  display: flex;\n  flex-direction: column;\n  width: 110px;\n  height: 130px;\n  background: var(--bg-elev);\n  border-radius: 6px;\n  overflow: hidden;\n  box-shadow: var(--shadow-card);\n  position: relative;\n}\n.kb-index__head {\n  background: var(--ink);\n  color: var(--tab-fg);\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-sm);\n  text-align: center;\n  padding: 8px 6px 12px 6px;\n  line-height: 1.1;\n  position: relative;\n  /* Notch the bottom-left of the header strip */\n  clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 12px));\n}\n.kb-index__head--muted { background: var(--ink-muted); font-style: italic; }\n.kb-index__map {\n  flex: 1;\n  background-color: var(--paper-2);\n  background-size: cover;\n  background-position: center;\n  position: relative;\n}\n.kb-index__pgnum {\n  position: absolute;\n  bottom: 6px;\n  right: 6px;\n  background: var(--bg-elev);\n  color: var(--ink);\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-md);\n  border-radius: 4px;\n  padding: 2px 8px;\n  box-shadow: 0 1px 2px rgba(0,0,0,0.08);\n  /* Slight notch on the top-left */\n  clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);\n}\n\n/* ──────────────────────────────────────────────────────────────────────────────\n *  KB-FOOTER — small metadata strip at page bottom\n * ────────────────────────────────────────────────────────────────────────────── */\n.kb-footer {\n  font-family: var(--font-body);\n  font-size: var(--fs-xs);\n  color: var(--ink-2);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--sp-5);\n  padding: var(--sp-3) var(--sp-5);\n}\n\n/* Tracked uppercase metadata line */\n.kb-meta-line {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--fs-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-x-wide);\n  color: var(--ink-2);\n}\n<\u002Fstyle>\n<style>\n  /* ───────── Viewer chrome (NOT part of the kneeboard) ───────── */\n  html, body { margin: 0; background: #1f2024; color: #ddd; font-family: var(--font-body); min-height: 100%; }\n  .toc { padding: 22px 36px 18px; border-bottom: 1px solid #383a40; }\n  .toc h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0; color: #f7d046; text-transform: uppercase; letter-spacing: -0.005em; }\n  .toc .lede { font-size: 13px; color: #b3b6bd; margin: 6px 0 0; max-width: 920px; line-height: 1.5; }\n  .toc nav { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }\n  .toc a { color: #ddd; text-decoration: none; padding: 6px 12px; border: 1px solid #4a4d54; border-radius: 2px; font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.02em; }\n  .toc a:hover { background: #f7d046; color: #15171a; border-color: #f7d046; }\n  .toc .crumb { font-family: var(--font-mono); font-size: 11px; color: #8e9099; margin-top: 8px; display: block; }\n\n  .stage-label { color: #8e9099; font-family: var(--font-mono); font-size: 12px; padding: 36px 36px 6px; letter-spacing: 0.06em; text-transform: uppercase; }\n  .stage-label b { color: #f1f2f5; font-weight: 700; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.02em; margin-right: 10px; }\n  .stage-sub { color: #8e9099; font-size: 12px; padding: 0 36px 16px; max-width: 880px; line-height: 1.5; }\n  .stage { padding: 6px 36px 36px; }\n\n  /* Each kneeboard renders at exact 1536x2048 (output spec) but is scaled to fit on screen. */\n  .frame-row { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start; }\n  .frame-wrap { width: 614.4px; /* 1536 * 0.4 */ }\n  .frame-wrap .meta { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; color: #b3b6bd; font-family: var(--font-mono); font-size: 11px; }\n  .frame-wrap .meta .name { color: #f7d046; font-family: var(--font-display); font-size: 16px; letter-spacing: 0.02em; text-transform: uppercase; }\n  .frame { width: 614.4px; height: 819.2px; background: #fff; box-shadow: 0 12px 36px rgba(0,0,0,0.5); position: relative; overflow: hidden; }\n  .frame .kb-mig { transform: scale(0.4); transform-origin: top left; }\n\n  /* ────────────────────────────────────────────────────────────────────\n   *  KNEEBOARD PAGE — exactly 1536 × 2048 px (DCS portrait kneeboard)\n   * ──────────────────────────────────────────────────────────────────── */\n  .kb-mig {\n    width: 1536px; height: 2048px;\n    background: #ffffff;\n    color: var(--ink);\n    font-family: var(--font-body);\n    position: relative; overflow: hidden;\n    box-sizing: border-box;\n    padding: 48px;\n    display: flex; flex-direction: column;\n    --gap: 24px;\n    --rule-w: 2px;\n    --rule-w-thin: 1.5px;\n    --row-h: 64px;\n    --row-h-tight: 44px;\n    --head-h: 70px;\n  }\n\n  /* HEADER */\n  .kb-mig__hdr {\n    display: grid;\n    grid-template-columns: auto 1fr auto;\n    align-items: stretch;\n    border: var(--rule-w) solid var(--ink);\n    background: #fff;\n    margin-bottom: var(--gap);\n  }\n  .kb-mig__hdr .pn {\n    background: var(--ink); color: #fff;\n    padding: 18px 44px 18px 28px;\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 56px; letter-spacing: 0.02em; line-height: 1;\n    display: flex; align-items: center; gap: 14px;\n    clip-path: polygon(0 0, 100% 0, calc(100% - 24px) 100%, 0 100%);\n    text-transform: uppercase;\n    white-space: nowrap;\n  }\n  .kb-mig__hdr .pn small { font-family: var(--font-mono); font-weight: 500; font-size: 22px; letter-spacing: 0.08em; opacity: 0.7; }\n  .kb-mig__hdr .ttl {\n    display: flex; flex-direction: column; justify-content: center;\n    padding: 10px 24px;\n    border-left: 0;\n  }\n  .kb-mig__hdr .ttl h1 {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 70px; line-height: 1; margin: 0;\n    text-transform: uppercase; letter-spacing: -0.005em;\n    color: var(--ink);\n  }\n  .kb-mig__hdr .ttl .sub {\n    margin-top: 8px;\n    font-family: var(--font-body); font-weight: 600;\n    font-size: 24px; color: var(--ink-2);\n    letter-spacing: 0.04em;\n  }\n  .kb-mig__hdr .meta {\n    display: grid; grid-template-columns: auto auto;\n    border-left: var(--rule-w) solid var(--ink);\n    align-items: stretch;\n    font-family: var(--font-mono);\n  }\n  .kb-mig__hdr .meta { grid-template-columns: 1fr; }\n  .kb-mig__hdr .meta .cell {\n    padding: 14px 26px;\n    display: flex; flex-direction: column; justify-content: center;\n    border-bottom: var(--rule-w-thin) solid var(--ink);\n    min-width: 280px;\n  }\n  .kb-mig__hdr .meta .cell:last-child { border-bottom: none; }\n  .kb-mig__hdr .meta .lbl {\n    font-family: var(--font-body); font-weight: 700;\n    font-size: 14px; color: var(--ink-2);\n    letter-spacing: 0.18em; text-transform: uppercase;\n    line-height: 1; margin-bottom: 8px;\n  }\n  .kb-mig__hdr .meta .v { font-family: var(--font-mono); font-weight: 500; font-size: 28px; color: var(--ink); line-height: 1; }\n\n  /* (yellow corner pennant removed — was redundant with header data) */\n\n  /* SECTION CARDS */\n  .sec {\n    border: var(--rule-w) solid var(--ink);\n    background: #fff;\n    display: flex; flex-direction: column;\n    min-height: 0;\n  }\n  .sec__head {\n    background: var(--ink); color: #fff;\n    height: var(--head-h);\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 24px;\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 34px; letter-spacing: 0.04em;\n    text-transform: uppercase; line-height: 1;\n    flex-shrink: 0;\n  }\n  .sec__head .ttl { display: flex; align-items: baseline; gap: 16px; white-space: nowrap; }\n  .sec__head .ttl span { white-space: nowrap; }\n  .sec__head .sub {\n    font-family: var(--font-body); font-weight: 500;\n    font-size: 16px; letter-spacing: 0.18em; opacity: 0.7;\n    text-transform: uppercase;\n  }\n  .sec__head .count {\n    font-family: var(--font-mono); font-weight: 600;\n    font-size: 22px; opacity: 0.78;\n    letter-spacing: 0.04em;\n  }\n  /* \"Band\" treatment — a thicker labelled strip used to group sections */\n  .band__head {\n    background: var(--ink); color: #fff;\n    height: 52px;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 26px;\n    font-family: var(--font-display); font-weight: 700;\n    font-size: 28px; letter-spacing: 0.18em;\n    text-transform: uppercase; line-height: 1;\n    margin-bottom: 12px;\n    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);\n    flex-shrink: 0;\n  }\n  .band__head .right { font-family: var(--font-mono); font-weight: 500; font-size: 18px; letter-spacing: 0.06em; opacity: 0.7; }\n\n  /* COLUMN HEADER STRIP inside a section */\n  .ch {\n    display: grid; align-items: center;\n    background: #ECEEF1;\n    border-bottom: var(--rule-w-thin) solid var(--ink);\n    padding: 8px 0;\n  }\n  .ch > div {\n    padding: 0 22px;\n    font-family: var(--font-body); font-weight: 700;\n    font-size: 16px; letter-spacing: 0.18em;\n    text-transform: uppercase; color: var(--ink-2);\n    line-height: 1;\n  }\n  .ch > div + div { border-left: 1px dotted var(--rule); }\n\n  /* DATA ROW */\n  .row {\n    display: grid; align-items: center;\n    min-height: var(--row-h);\n    padding: 8px 0;\n    border-bottom: 1px dotted var(--rule);\n  }\n  .row:last-child { border-bottom: none; }\n  .row > div { padding: 0 22px; line-height: 1.1; }\n  .row > div + div { border-left: 1px dotted var(--rule); }\n\n  .row.tight { min-height: var(--row-h-tight); padding: 4px 0; }\n\n  /* CELL TYPOGRAPHY */\n  .slot { font-family: var(--font-mono); font-weight: 500; font-size: 30px; color: var(--ink); letter-spacing: 0.02em; white-space: nowrap; }\n  .name { font-family: var(--font-body); font-weight: 600; font-size: 32px; color: var(--ink); }\n  .name.sm { font-size: 26px; }\n  .val { font-family: var(--font-mono); font-weight: 500; font-size: 28px; color: var(--ink); }\n  .val.muted { color: var(--ink-3); }\n  .ch-tag { font-family: var(--font-mono); font-weight: 700; font-size: 26px; color: var(--ink-2); }\n  .freq { font-family: var(--font-mono); font-weight: 500; font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; }\n  .mod { font-family: var(--font-mono); font-weight: 500; font-size: 22px; color: var(--ink-2); }\n\n  /* STATUS chips for SPO-15 */\n  .st {\n    display: inline-flex; align-items: center; justify-content: center;\n    min-width: 110px;\n    height: 44px;\n    padding: 0 18px;\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 24px; letter-spacing: 0.12em;\n    text-transform: uppercase;\n    border: 2px solid currentColor;\n    line-height: 1;\n  }\n  .st--lock { background: #fff; color: var(--data-red); border-color: var(--data-red); font-weight: 800; }\n  .st--on   { background: #fff; color: var(--data-green); border-color: var(--data-green); font-weight: 800; }\n  .st--off  { background: #fff; color: var(--ink-3); border-color: var(--ink-3); }\n  .cyr { font-family: var(--font-display); font-weight: 800; font-size: 48px; line-height: 1; color: var(--ink); }\n  .cyr-lat { font-family: var(--font-mono); font-weight: 400; font-size: 36px; color: var(--ink-3); margin-left: 8px; }\n\n  /* EMPTY STATE */\n  .empty {\n    flex: 1;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    color: var(--ink-3);\n    padding: 36px 18px;\n    gap: 8px;\n  }\n  .empty .lbl {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 42px; letter-spacing: 0.16em;\n    text-transform: uppercase;\n  }\n  .empty .hint {\n    font-family: var(--font-body); font-weight: 500; font-size: 18px;\n    letter-spacing: 0.12em; text-transform: uppercase;\n    color: var(--ink-3);\n  }\n  .empty .hatch {\n    width: 80%; height: 1px; background-image: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px);\n    margin: 4px 0 6px;\n  }\n\n  /* GRID HELPERS */\n  .grid { display: grid; gap: var(--gap); flex: 1; min-height: 0; }\n  .gap-sm { gap: 16px; }\n\n  /* ──── Layout-specific grid templates ──── */\n  /* Layout 1 — Omar's Grid (3×3 with ADF spanning 2 cols and Radio spanning 2 rows) */\n  .L1 .grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    grid-template-rows: 420px 1fr 1fr;\n    gap: var(--gap);\n    flex: 1; min-height: 0;\n  }\n  .L1 .g-wpt   { grid-column: 1; grid-row: 1; }\n  .L1 .g-ard   { grid-column: 2; grid-row: 1; }\n  .L1 .g-rsbn  { grid-column: 3; grid-row: 1; }\n  .L1 .g-adf   { grid-column: 1 / span 2; grid-row: 2; }\n  .L1 .g-radio { grid-column: 3; grid-row: 2 / span 2; }\n  .L1 .g-spo   { grid-column: 1; grid-row: 3; }\n  .L1 .g-cmds  { grid-column: 2; grid-row: 3; }\n  .L1 .grid > div { display: flex; min-height: 0; }\n  .L1 .grid > div > section { flex: 1; min-height: 0; overflow: hidden; }\n\n  /* Radio dual-column body */\n  .radio-2col {\n    display: grid; grid-template-columns: 1fr 1fr;\n    flex: 1; min-height: 0;\n  }\n  .radio-2col > .col + .col { border-left: var(--rule-w-thin) solid var(--ink); }\n  .radio-2col .col { display: flex; flex-direction: column; min-height: 0; }\n  .radio-1col { display: flex; flex-direction: column; flex: 1; min-height: 0; }\n\n  /* ────────────────────────────────────────────────────────────────────\n   *  SPEC SHEET (designer-facing reference)\n   * ──────────────────────────────────────────────────────────────────── */\n  .spec {\n    background: #f3f1ec;\n    color: #15171a;\n    margin: 36px;\n    padding: 36px 44px;\n    border: 1px solid #c8c2b6;\n  }\n  .spec h2 { font-family: var(--font-display); font-weight: 800; font-size: 32px; margin: 0 0 8px; letter-spacing: -0.005em; text-transform: uppercase; color: var(--ink); }\n  .spec h3 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 24px 0 8px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 4px; }\n  .spec p { font-size: 13px; line-height: 1.55; margin: 0 0 8px; max-width: 920px; }\n  .spec table { border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; width: 100%; max-width: 980px; }\n  .spec table th, .spec table td { padding: 6px 12px; text-align: left; border-bottom: 1px dotted #c8c2b6; vertical-align: top; }\n  .spec table th { font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); }\n  .spec .swatch { display: inline-flex; align-items: center; gap: 6px; }\n  .spec .swatch i { width: 14px; height: 14px; display: inline-block; border: 1px solid rgba(0,0,0,0.15); }\n  .spec code { background: #e8e4dc; padding: 1px 6px; border-radius: 2px; font-size: 12px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"toc\">\n  <h1>MiG-29 DTC Kneeboard<\u002Fh1>\n  <p class=\"lede\">DCS MiG-29A DTC summary kneeboard, rendered at exact 1536×2048 px portrait. Followed by a Pillow-ready spec sheet and an empty-state RSBN reference.<\u002Fp>\n  <nav>\n    <a href=\"#L1\">Kneeboard<\u002Fa>\n    <a href=\"#empty\">Empty state<\u002Fa>\n    <a href=\"#spec\">Spec sheet<\u002Fa>\n  <\u002Fnav>\n  <span class=\"crumb\">on-screen: scaled 0.40× · output: 1536 × 2048 JPG · white background<\u002Fspan>\n<\u002Fdiv>\n\n<div class=\"stage-label\" id=\"L1\"><b>Kneeboard<\u002Fb> WPT · ARD · RSBN across the top, ADF in the middle, SPO-15 / CMDS / Radio along the bottom<\u002Fdiv>\n<div class=\"stage-sub\">Three-column grid. Top row holds the navigation triplet (each box sized to take 3 entries). ADF spans columns 1–2. Radio occupies column 3 across the bottom two rows; SPO-15 and CMDS fill the bottom-left.<\u002Fdiv>\n<div class=\"stage\"><div class=\"frame-row\"><div class=\"frame-wrap\">\n  <div class=\"meta\"><span class=\"name\">Kneeboard<\u002Fspan><span>1536 × 2048 px · white bg · scale 0.40×<\u002Fspan><\u002Fdiv>\n  <div class=\"frame\"><div id=\"m-L1\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"stage-label\" id=\"empty\"><b>Empty state<\u002Fb> RSBN with no configured stations<\u002Fdiv>\n<div class=\"stage-sub\">When a section has no data, the row area is replaced with a centered “NO CONFIG” label in muted ink, flanked by hatched rules. Section header band remains identical so the grid stays stable across mission cards.<\u002Fdiv>\n<div class=\"stage\"><div class=\"frame-row\"><div class=\"frame-wrap\">\n  <div class=\"meta\"><span class=\"name\">L1 · empty RSBN<\u002Fspan><span>1536 × 2048 px · white bg · scale 0.40×<\u002Fspan><\u002Fdiv>\n  <div class=\"frame\"><div id=\"m-LE\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<!-- SPEC SHEET (rendered as part of the same document for designer reference) -->\n<div class=\"spec\" id=\"spec\">\n  <h2>Pillow Replication Spec<\u002Fh2>\n  <p><strong>Canvas.<\u002Fstrong> 1536 × 2048 px (portrait), background <code>#FFFFFF<\u002Fcode> (true white for cockpit-display contrast — kneeboard paper cream is too low-contrast at small scale). All measurements below are in pixels at this resolution.<\u002Fp>\n\n  <h3>Page frame<\u002Fh3>\n  <table>\n    <tbody><tr><th>Element<\u002Fth><th>Value<\u002Fth><\u002Ftr>\n    <tr><td>Outer margin (all sides)<\u002Ftd><td>48<\u002Ftd><\u002Ftr>\n    <tr><td>Section gap (between sibling sections)<\u002Ftd><td>24<\u002Ftd><\u002Ftr>\n    <tr><td>Outer / structural border weight<\u002Ftd><td>2.0 px solid <code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Inner / divider border weight<\u002Ftd><td>1.5 px solid <code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Row separator<\u002Ftd><td>1 px dotted <code>#C8C2B6<\u002Fcode> (6px on / 6px off)<\u002Ftd><\u002Ftr>\n    <tr><td>Col separator<\u002Ftd><td>1 px dotted <code>#C8C2B6<\u002Fcode><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Header (top of page, full width)<\u002Fh3>\n  <table>\n    <tbody><tr><th>Sub-element<\u002Fth><th>Spec<\u002Fth><\u002Ftr>\n    <tr><td>Strip total height<\u002Ftd><td>~150 px (auto-fits content + padding)<\u002Ftd><\u002Ftr>\n    <tr><td>Page-tag (left, ink fill, 22px notch on bottom-right)<\u002Ftd><td>Background <code>#15171A<\u002Fcode>, height = strip; padding 14 / 22 / 14 / 36; text Barlow Condensed 800 36 px white, all-caps<\u002Ftd><\u002Ftr>\n    <tr><td>Title<\u002Ftd><td>Barlow Condensed 800, 56 px, <code>#15171A<\u002Fcode>, all-caps, line-height 1, tracking −0.005em<\u002Ftd><\u002Ftr>\n    <tr><td>Subtitle line<\u002Ftd><td>Barlow 500, 18 px, <code>#2C2F35<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Meta cells (Active Program, Map, Generated)<\u002Ftd><td>Each cell: padding 10×22, label Barlow 700 12 px tracked 0.18em UPPER <code>#2C2F35<\u002Fcode>; value JetBrains Mono 500 22 px <code>#15171A<\u002Fcode>; “Program 1” uses Barlow Condensed 800 30 px instead.<\u002Ftd><\u002Ftr>\n    <tr><td>DimOn-style yellow pennant (top-right corner)<\u002Ftd><td>Background <code>#F7D046<\u002Fcode>, 18 px diagonal cut on bottom-left, optional — purely brand chrome<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Section card<\u002Fh3>\n  <table>\n    <tbody><tr><th>Sub-element<\u002Fth><th>Spec<\u002Fth><\u002Ftr>\n    <tr><td>Border<\u002Ftd><td>2 px solid <code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Header band height<\u002Ftd><td>64 px, fill <code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Header title<\u002Ftd><td>Barlow Condensed 800, 28 px white, tracked 0.04em, all-caps, padded 22 px L/R<\u002Ftd><\u002Ftr>\n    <tr><td>Header subtitle (optional, e.g. “NAV” or count)<\u002Ftd><td>Barlow 500 14 px white, tracked 0.18em, opacity 0.70<\u002Ftd><\u002Ftr>\n    <tr><td>Header right-side count (e.g. “3 / 3”)<\u002Ftd><td>JetBrains Mono 500 18 px white, opacity 0.75<\u002Ftd><\u002Ftr>\n    <tr><td>Column-header strip (inside body, when used)<\u002Ftd><td>Fill <code>#ECEEF1<\u002Fcode> (cool light gray), height 40 px, text Barlow 700 13 px <code>#2C2F35<\u002Fcode> tracked 0.18em UPPER<\u002Ftd><\u002Ftr>\n    <tr><td>Default row min-height<\u002Ftd><td>56 px<\u002Ftd><\u002Ftr>\n    <tr><td>Compact row (Radio 20-channel)<\u002Ftd><td>40 px min-height<\u002Ftd><\u002Ftr>\n    <tr><td>Row inner padding<\u002Ftd><td>8 px top/bottom, 18 px left/right<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Cell typography<\u002Fh3>\n  <table>\n    <tbody><tr><th>Style<\u002Fth><th>Family<\u002Fth><th>Weight<\u002Fth><th>Size<\u002Fth><th>Color<\u002Fth><\u002Ftr>\n    <tr><td>Slot tag (WPT1, ARD1, RSBN1, ADF 1, CH 00)<\u002Ftd><td>JetBrains Mono<\u002Ftd><td>500<\u002Ftd><td>24 px<\u002Ftd><td><code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Resolved name<\u002Ftd><td>Barlow<\u002Ftd><td>600<\u002Ftd><td>26 px<\u002Ftd><td><code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Secondary value (runway, ch number, freq)<\u002Ftd><td>JetBrains Mono<\u002Ftd><td>500<\u002Ftd><td>22–24 px (tabular nums)<\u002Ftd><td><code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Modulation tag (AM/FM)<\u002Ftd><td>JetBrains Mono<\u002Ftd><td>500<\u002Ftd><td>18 px<\u002Ftd><td><code>#2C2F35<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>SPO-15 Cyrillic glyph<\u002Ftd><td>Barlow Condensed<\u002Ftd><td>800<\u002Ftd><td>36 px<\u002Ftd><td><code>#15171A<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>SPO-15 Latin equivalent (parens)<\u002Ftd><td>JetBrains Mono<\u002Ftd><td>500<\u002Ftd><td>16 px<\u002Ftd><td><code>#2C2F35<\u002Fcode><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>SPO-15 status chips<\u002Fh3>\n  <p>Pill-style fixed-width chip (min-width 90 px, height 36 px, no radius). Centered text is Barlow Condensed 800 18 px tracked 0.12em UPPER. Three states:<\u002Fp>\n  <table>\n    <tbody><tr><th>State<\u002Fth><th>Fill<\u002Fth><th>Text<\u002Fth><th>Border<\u002Fth><th>Notes<\u002Fth><\u002Ftr>\n    <tr><td>Lock<\u002Ftd><td><code>#FFFFFF<\u002Fcode><\u002Ftd><td><span class=\"swatch\"><i style=\"background:#C1273B\"><\u002Fi><code>#C1273B<\u002Fcode><\u002Fspan><\u002Ftd><td>1.5 px <code>#C1273B<\u002Fcode><\u002Ftd><td>Outlined red, bold weight. Highest-priority threat — reads at glance without dominating.<\u002Ftd><\u002Ftr>\n    <tr><td>On<\u002Ftd><td><code>#FFFFFF<\u002Fcode><\u002Ftd><td><span class=\"swatch\"><i style=\"background:#1F8A3F\"><\u002Fi><code>#1F8A3F<\u002Fcode><\u002Fspan><\u002Ftd><td>1.5 px <code>#1F8A3F<\u002Fcode><\u002Ftd><td>Outlined green. Active but not critical.<\u002Ftd><\u002Ftr>\n    <tr><td>Off<\u002Ftd><td><code>#FFFFFF<\u002Fcode><\u002Ftd><td><span class=\"swatch\"><i style=\"background:#8A8E95\"><\u002Fi><code>#8A8E95<\u002Fcode><\u002Fspan><\u002Ftd><td>1.5 px <code>#8A8E95<\u002Fcode><\u002Ftd><td>Muted gray, no fill.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Empty-state pattern<\u002Fh3>\n  <p>When a section has no entries the body area shows: a top hatched rule (6px-on/6px-off, 1 px, color <code>#C8C2B6<\u002Fcode>), then centered text <strong>NO CONFIG<\u002Fstrong> in Barlow Condensed 800 32 px <code>#8A8E95<\u002Fcode> tracked 0.16em UPPER, optional hint “NOT PROGRAMMED” in Barlow 500 14 px tracked 0.12em <code>#8A8E95<\u002Fcode>, then a bottom hatched rule. The header band is unchanged so muscle memory holds.<\u002Fp>\n\n  <h3>Color palette<\u002Fh3>\n  <table>\n    <tbody><tr><th>Token<\u002Fth><th>Hex<\u002Fth><th>Used for<\u002Fth><\u002Ftr>\n    <tr><td>ink<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#15171A\"><\u002Fi>#15171A<\u002Fspan><\u002Ftd><td>All primary text, section header fills, structural rules<\u002Ftd><\u002Ftr>\n    <tr><td>ink-2<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#2C2F35\"><\u002Fi>#2C2F35<\u002Fspan><\u002Ftd><td>Secondary text, eyebrows<\u002Ftd><\u002Ftr>\n    <tr><td>ink-3<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#8A8E95\"><\u002Fi>#8A8E95<\u002Fspan><\u002Ftd><td>“Off” status, NO CONFIG label<\u002Ftd><\u002Ftr>\n    <tr><td>col-header<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#ECEEF1\"><\u002Fi>#ECEEF1<\u002Fspan><\u002Ftd><td>Column-header strip fill (cool light gray)<\u002Ftd><\u002Ftr>\n    <tr><td>paper-2<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#E8E4DC\"><\u002Fi>#E8E4DC<\u002Fspan><\u002Ftd><td>(reference only) warm cream from base palette<\u002Ftd><\u002Ftr>\n    <tr><td>rule<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#C8C2B6\"><\u002Fi>#C8C2B6<\u002Fspan><\u002Ftd><td>Dotted dividers<\u002Ftd><\u002Ftr>\n    <tr><td>brand-yellow<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#F7D046\"><\u002Fi>#F7D046<\u002Fspan><\u002Ftd><td>Optional DimOn-style corner pennant<\u002Ftd><\u002Ftr>\n    <tr><td>data-red<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#C1273B\"><\u002Fi>#C1273B<\u002Fspan><\u002Ftd><td>SPO-15 Lock state, critical flags<\u002Ftd><\u002Ftr>\n    <tr><td>data-green<\u002Ftd><td><span class=\"swatch\"><i style=\"background:#1F8A3F\"><\u002Fi>#1F8A3F<\u002Fspan><\u002Ftd><td>SPO-15 On state<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Fonts<\u002Fh3>\n  <p>Barlow Condensed (display, 700/800), Barlow (body, 500/600/700), JetBrains Mono (data, 500/700) — all available on Google Fonts. Substitute with Oswald / Open Sans / Roboto Mono if exact families aren't bundled with the Pillow generator. All numeric data uses <code>font-variant-numeric: tabular-nums<\u002Fcode> to keep frequency columns aligned.<\u002Fp>\n\n  <h3>Layout-specific column splits<\u002Fh3>\n  <table>\n    <tbody><tr><th>Layout<\u002Fth><th>Body grid (rows × cols)<\u002Fth><th>Notable proportions<\u002Fth><\u002Ftr>\n    <tr><td>Kneeboard<\u002Ftd><td>3 rows · top 420 px (3-entry nav triplet), mid + bottom 1fr each<\u002Ftd><td>ADF spans cols 1–2 of row 2. Radio occupies col 3 of rows 2–3 (carries the full 20-row preset list). SPO-15 + CMDS fill cols 1 and 2 of row 3.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<script>\n/* Sample data — identical across all 4 layouts. */\nconst D = {\n  hdr: { title: \"MiG-29 DTC Configuration\", program: \"Program 1\", map: \"Syria\", generated: \"08 May 2026 14:32 UTC\" },\n  wpt: [{ slot:\"WPT1\", name:\"Abu al-Duhur\" }],\n  wptCap: 3,\n  ard: [\n    { slot:\"ARD1\", name:\"Abu al-Duhur\",   rwy:\"—\" },\n    { slot:\"ARD2\", name:\"Wujah Al Hajar\", rwy:\"02\" },\n    { slot:\"ARD3\", name:\"Shayrat\",        rwy:\"—\" },\n  ],\n  ardCap: 3,\n  rsbn: [{ slot:\"RSBN1\", name:\"Krasnodar-Center\", ch:\"Ch 40\" }],\n  rsbnCap: 3,\n  adf: [\n    { ch:\"ADF 1\", inner:\"Rayak\",   outer:\"Bassel\"   },\n    { ch:\"ADF 2\", inner:\"Tiyas\",   outer:\"Damascus\" },\n    { ch:\"ADF 3\", inner:\"Hama\",    outer:\"Aleppo\"   },\n    { ch:\"ADF 4\", inner:\"Palmyra\", outer:\"Beirut\"   },\n  ],\n  radio: [\n    [0,124],[1,264],[2,265],[3,256],[4,254],[5,250],[6,270],[7,257],[8,255],[9,262],\n    [10,259],[11,268],[12,269],[13,260],[14,263],[15,261],[16,267],[17,258],[18,253],[19,251],\n  ],\n  cmds: [\n    [\"Burst Count I\",\"1\"],\n    [\"Burst Count II\",\"1\"],\n    [\"Burst Interval\",\"0.5s\"],\n    [\"Salvo Count (Air)\",\"1\"],\n    [\"Salvo Count (SAM)\",\"6\"],\n    [\"Salvo Interval\",\"5s\"],\n  ],\n  spo: [\n    { cyr:\"П\", lat:\"P\", st:\"Lock\" },\n    { cyr:\"З\", lat:\"3\", st:\"On\"   },\n    { cyr:\"Х\", lat:\"X\", st:\"Off\"  },\n    { cyr:\"Н\", lat:\"H\", st:\"On\"   },\n    { cyr:\"Ф\", lat:\"F\", st:\"Lock\" },\n    { cyr:\"С\", lat:\"C\", st:\"Off\"  },\n  ],\n};\n\n/* ───────── Builders ───────── */\nconst fmt = (n) => String(n).padStart(2,\"0\");\nconst pad2 = (n) => String(n).padStart(2,\"0\");\n\nfunction header() {\n  return `\n  <div class=\"kb-mig__hdr\">\n    <div class=\"pn\">MiG-29A<\u002Fdiv>\n    <div class=\"ttl\">\n      <h1>DTC · ${D.hdr.program}<\u002Fh1>\n      <div class=\"sub\">Data Transfer Cartridge Configuration Summary<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta\">\n      <div class=\"cell\"><div class=\"lbl\">Theatre<\u002Fdiv><div class=\"v\">${D.hdr.map}<\u002Fdiv><\u002Fdiv>\n      <div class=\"cell\"><div class=\"lbl\">Generated<\u002Fdiv><div class=\"v\">${D.hdr.generated}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  `;\n}\n\n/* Section card with custom body */\nfunction sec(opts) {\n  const { title, eyebrow, body } = opts;\n  return `\n  <section class=\"sec\">\n    <div class=\"sec__head\">\n      <div class=\"ttl\"><span>${title}<\u002Fspan>${eyebrow ? `<span class=\"sub\">${eyebrow}<\u002Fspan>` : \"\"}<\u002Fdiv>\n    <\u002Fdiv>\n    ${body}\n  <\u002Fsection>`;\n}\n\nfunction emptyBody(hint = \"Not programmed\") {\n  return `<div class=\"empty\">\n    <div class=\"hatch\"><\u002Fdiv>\n    <div class=\"lbl\">No Config<\u002Fdiv>\n    <div class=\"hint\">${hint}<\u002Fdiv>\n    <div class=\"hatch\"><\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* WPT (slot + name) */\nfunction wptBody(rows = D.wpt, cap = D.wptCap) {\n  const filled = rows.map(r => `\n    <div class=\"row\" style=\"grid-template-columns: 110px 1fr;\">\n      <div><span class=\"slot\">${r.slot}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"name\">${r.name}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  const empties = Array.from({length: cap - rows.length}, (_, i) => `\n    <div class=\"row\" style=\"grid-template-columns: 110px 1fr;\">\n      <div><span class=\"slot\" style=\"opacity:.45\">WPT${rows.length + i + 1}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"val muted\">—<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  return `<div class=\"ch\" style=\"grid-template-columns: 110px 1fr;\"><div>Slot<\u002Fdiv><div>Resolved Name<\u002Fdiv><\u002Fdiv>${filled}${empties}`;\n}\n\n/* ARD */\nfunction ardBody(rows = D.ard, cap = D.ardCap) {\n  const cols = \"grid-template-columns: 130px 1fr 65px;\";\n  const filled = rows.map(r => `\n    <div class=\"row\" style=\"${cols}\">\n      <div><span class=\"slot\">${r.slot}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"name\">${r.name}<\u002Fspan><\u002Fdiv>\n      <div style=\"width:65px;\"><span class=\"val ${r.rwy === \"—\" ? \"muted\" : \"\"}\">${r.rwy}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  const empties = Array.from({length: cap - rows.length}, (_, i) => `\n    <div class=\"row\" style=\"${cols}\"><div><span class=\"slot\" style=\"opacity:.45\">ARD${rows.length + i + 1}<\u002Fspan><\u002Fdiv><div><span class=\"val muted\">—<\u002Fspan><\u002Fdiv><div style=\"width:65px;\"><span class=\"val muted\">—<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join(\"\");\n  return `<div class=\"ch\" style=\"${cols}\"><div>Slot<\u002Fdiv><div>Resolved Name<\u002Fdiv><div>RWY<\u002Fdiv><\u002Fdiv>${filled}${empties}`;\n}\n\n/* RSBN */\nfunction rsbnBody(rows = D.rsbn, cap = D.rsbnCap) {\n  if (rows.length === 0) return emptyBody(\"RSBN not programmed\");\n  const cols = \"grid-template-columns: 130px 1fr 110px;\";\n  const filled = rows.map(r => `\n    <div class=\"row\" style=\"${cols}\">\n      <div><span class=\"slot\">${r.slot}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"name\">${r.name}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"val\">${r.ch}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  const empties = Array.from({length: cap - rows.length}, (_, i) => `\n    <div class=\"row\" style=\"${cols}\"><div><span class=\"slot\" style=\"opacity:.45\">RSBN${rows.length + i + 1}<\u002Fspan><\u002Fdiv><div><span class=\"val muted\">—<\u002Fspan><\u002Fdiv><div><span class=\"val muted\">—<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join(\"\");\n  return `<div class=\"ch\" style=\"${cols}\"><div>Slot<\u002Fdiv><div>Station<\u002Fdiv><div>Channel<\u002Fdiv><\u002Fdiv>${filled}${empties}`;\n}\n\n/* ADF (channel | inner | outer) */\nfunction adfBody(rows = D.adf) {\n  const cols = \"grid-template-columns: 170px 1fr 1fr;\";\n  const filled = rows.map(r => `\n    <div class=\"row\" style=\"${cols}\">\n      <div><span class=\"slot\">${r.ch}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:32px;\"><span class=\"name sm\" style=\"font-size:32px;\">${r.inner}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:32px;\"><span class=\"name sm\" style=\"font-size:32px;\">${r.outer}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  return `<div class=\"ch\" style=\"${cols}\"><div>Channel<\u002Fdiv><div style=\"font-size:16px;\">Inner<\u002Fdiv><div style=\"font-size:16px;\">Outer<\u002Fdiv><\u002Fdiv>${filled}`;\n}\n\n/* Radio — one column */\nfunction radioBody1col(rows = D.radio) {\n  const cols = \"grid-template-columns: 130px 1fr 80px;\";\n  const list = rows.map(([n, f]) => `\n    <div class=\"row tight\" style=\"${cols}\">\n      <div><span class=\"slot\">CH ${pad2(n)}<\u002Fspan><\u002Fdiv>\n      <div style=\"padding-left:32px;\"><span class=\"freq\">${f.toFixed(3)}<\u002Fspan><\u002Fdiv>\n      <div><span class=\"mod\">AM<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  return `<div class=\"radio-1col\"><div class=\"ch\" style=\"${cols}\"><div>CH<\u002Fdiv><div style=\"padding-left:32px;\">Freq · MHz<\u002Fdiv><div>Mod<\u002Fdiv><\u002Fdiv>${list}<\u002Fdiv>`;\n}\n\n/* Radio — two columns (CH 0–9 / CH 10–19) */\nfunction radioBody2col(rows = D.radio) {\n  const colsA = \"grid-template-columns: 130px 1fr 70px;\";\n  const left  = rows.slice(0,10);\n  const right = rows.slice(10);\n  const block = (set) => `\n    <div class=\"ch\" style=\"${colsA}\"><div>CH<\u002Fdiv><div>Freq · MHz<\u002Fdiv><div>Mod<\u002Fdiv><\u002Fdiv>\n    ${set.map(([n,f])=>`\n      <div class=\"row tight\" style=\"${colsA}\">\n        <div><span class=\"slot\">CH ${pad2(n)}<\u002Fspan><\u002Fdiv>\n        <div><span class=\"freq\">${f.toFixed(3)}<\u002Fspan><\u002Fdiv>\n        <div><span class=\"mod\">AM<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>`).join(\"\")}\n  `;\n  return `<div class=\"radio-2col\"><div class=\"col\">${block(left)}<\u002Fdiv><div class=\"col\">${block(right)}<\u002Fdiv><\u002Fdiv>`;\n}\n\n/* CMDS */\nfunction cmdsBody(rows = D.cmds) {\n  const cols = \"grid-template-columns: 1fr 110px;\";\n  const list = rows.map(([k,v]) => `\n    <div class=\"row\" style=\"${cols}\">\n      <div><span class=\"name sm\">${k}<\u002Fspan><\u002Fdiv>\n      <div style=\"text-align:right;\"><span class=\"val\">${v}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  return `<div class=\"ch\" style=\"${cols}\"><div>Parameter<\u002Fdiv><div style=\"text-align:right;\">Value<\u002Fdiv><\u002Fdiv>${list}`;\n}\n\n/* SPO-15 */\nfunction spoBody(rows = D.spo) {\n  const cols = \"grid-template-columns: 100px 1fr 130px;\";\n  const list = rows.map(r => {\n    const cls = r.st === \"Lock\" ? \"st--lock\" : r.st === \"On\" ? \"st--on\" : \"st--off\";\n    return `\n    <div class=\"row\" style=\"${cols}\">\n      <div><span class=\"cyr\">${r.cyr}<\u002Fspan><span class=\"cyr-lat\">(${r.lat})<\u002Fspan><\u002Fdiv>\n      <div style=\"padding-left:28px;\"><span class=\"name sm\" style=\"color:var(--ink-2)\">Threat type ${r.lat}<\u002Fspan><\u002Fdiv>\n      <div style=\"text-align:right;\"><span class=\"st ${cls}\">${r.st}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n  return `<div class=\"ch\" style=\"${cols}\"><div>Threat<\u002Fdiv><div style=\"padding-left:28px;\">Description<\u002Fdiv><div style=\"text-align:right;\">Status<\u002Fdiv><\u002Fdiv>${list}`;\n}\n\n/* ───────── Layout templates ───────── */\nfunction L1({ rsbnEmpty } = {}) {\n  const rsbn = rsbnEmpty\n    ? sec({ title:\"RSBN\", eyebrow:\"NAVAID\", headRight:\"0 / 3\", body: emptyBody(\"RSBN not programmed\") })\n    : sec({ title:\"RSBN\", eyebrow:\"NAVAID\", headRight:`${D.rsbn.length} / ${D.rsbnCap}`, body: rsbnBody() });\n  return `\n    <div class=\"kb-mig L1\">\n      ${header()}\n      <div class=\"grid\">\n        <div class=\"g-wpt\">${sec({ title:\"Waypoints\", eyebrow:\"WPT\", headRight:`${D.wpt.length} / ${D.wptCap}`, body: wptBody() })}<\u002Fdiv>\n        <div class=\"g-ard\">${sec({ title:\"Airdromes\", eyebrow:\"ARD\", headRight:`${D.ard.length} / ${D.ardCap}`, body: ardBody()
